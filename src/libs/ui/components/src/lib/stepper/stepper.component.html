<button
  #previousButton
  type="button"
  data-part="previous"
  [attr.aria-label]="previousAccessibleName()"
  (click)="previous.emit()"
  [disabled]="previousDisabled()"
>
  {{ previousGlyph() }}
</button>
<span>{{ text() }}</span>
<button
  #nextButton
  type="button"
  data-part="next"
  [attr.aria-label]="nextAccessibleName()"
  (click)="next.emit()"
  [disabled]="nextDisabled()"
>
  {{ nextGlyph() }}
</button>
